# The name displayed in the GitHub Actions tab.
name: Hello World with Python

# Events that start this workflow.
on:
  # Run when code is pushed to main.
  push:
    branches:
      - main
  # Allow the workflow to be started manually.
  workflow_dispatch:

# A collection of jobs that run in this workflow.
jobs:
  hello-python:
    # Descriptive name for the job.
    name: Run the Python Hello World program
    # Specifies the virtual machine runner environment.
    runs-on: ubuntu-latest
    # A sequence of tasks that will be executed as part of the job.
    steps:
      # Clones the repository onto the runner.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Runs the Python program with the specified environment variable.
      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py
